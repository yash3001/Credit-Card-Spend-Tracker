<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f172a">
<title>Spend Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Spends">
<meta name="mobile-web-app-capable" content="yes">
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#334155; --line:#334155;
    --text:#f1f5f9; --muted:#94a3b8; --accent:#38bdf8; --danger:#f87171;
    --good:#4ade80;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:16px; line-height:1.4; padding:env(safe-area-inset-top) 0 40px;
  }
  header{
    padding:16px 16px 8px; position:sticky; top:0; background:var(--bg); z-index:5;
  }
  .topbar{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:12px}
  h1{font-size:20px; margin:0; display:flex; align-items:center; gap:8px}
  .auth{display:flex; align-items:center; gap:8px}
  .auth img{width:28px; height:28px; border-radius:50%; border:1px solid var(--line)}
  .auth .who{font-size:12px; color:var(--muted); max-width:120px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .btn-sm{
    background:var(--panel); border:1px solid var(--line); color:var(--text);
    border-radius:10px; padding:8px 12px; font-size:13px; font-weight:600; cursor:pointer;
  }
  .btn-sm.primary{background:var(--accent); color:#04263a; border-color:var(--accent)}
  .sync{font-size:11px; color:var(--muted); margin-top:2px; min-height:14px}
  .sync.ok{color:var(--good)}
  .sync.warn{color:#fbbf24}
  .cards{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; scrollbar-width:none}
  .cards::-webkit-scrollbar{display:none}
  .tab{
    flex:0 0 auto; padding:10px 14px; border-radius:12px; background:var(--panel);
    border:1px solid var(--line); color:var(--muted); font-size:13px; font-weight:600;
    cursor:pointer; white-space:nowrap; transition:.15s;
  }
  .tab.active{background:var(--accent); color:#04263a; border-color:var(--accent)}
  main{padding:0 16px}
  .cycle-nav{
    display:flex; align-items:center; justify-content:space-between;
    margin:14px 0 10px;
  }
  .cycle-nav button{
    background:var(--panel); border:1px solid var(--line); color:var(--text);
    width:40px; height:40px; border-radius:10px; font-size:20px; cursor:pointer;
  }
  .cycle-nav button:disabled{opacity:.35; cursor:default}
  .cycle-label{text-align:center; font-size:13px; color:var(--muted)}
  .cycle-label b{display:block; color:var(--text); font-size:14px; margin-bottom:2px}
  .total{
    background:linear-gradient(135deg,var(--panel),var(--panel2));
    border:1px solid var(--line); border-radius:16px; padding:18px; margin-bottom:16px;
    text-align:center;
  }
  .total .amt{font-size:34px; font-weight:700; letter-spacing:-.5px}
  .total .lbl{font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:1px}
  form{display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap}
  input,select{
    background:var(--panel); border:1px solid var(--line); color:var(--text);
    border-radius:10px; padding:12px; font-size:16px; outline:none;
  }
  input:focus,select:focus{border-color:var(--accent)}
  #amount{flex:1 1 90px; min-width:0}
  #desc{flex:2 1 130px; min-width:0}
  #date{flex:1 1 140px}
  .add-btn{
    flex:1 1 100%; background:var(--accent); color:#04263a; border:none; font-weight:700;
    font-size:16px; padding:14px; border-radius:12px; cursor:pointer;
  }
  ul{list-style:none; margin:0; padding:0}
  li{
    display:flex; align-items:center; gap:12px; padding:14px 4px;
    border-bottom:1px solid var(--line);
  }
  li .info{flex:1; min-width:0}
  li .d{font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  li .dt{font-size:12px; color:var(--muted)}
  li .a{font-weight:700; font-variant-numeric:tabular-nums}
  li .del{
    background:none; border:none; color:var(--danger); font-size:18px; cursor:pointer;
    padding:6px;
  }
  .empty{text-align:center; color:var(--muted); padding:40px 0; font-size:14px}
  .summary{margin-top:6px}
  .srow{
    display:flex; align-items:center; gap:12px; padding:16px 14px; margin-bottom:10px;
    background:var(--panel); border:1px solid var(--line); border-radius:14px; cursor:pointer;
  }
  .srow:active{background:var(--panel2)}
  .srow .sinfo{flex:1; min-width:0}
  .srow .sname{font-weight:600}
  .srow .scyc{font-size:12px; color:var(--muted); margin-top:2px}
  .srow .samt{font-weight:700; font-variant-numeric:tabular-nums}
  .srow .schev{color:var(--muted); font-size:18px}
  .grand{
    background:linear-gradient(135deg,var(--panel),var(--panel2));
    border:1px solid var(--line); border-radius:16px; padding:18px; margin-bottom:16px; text-align:center;
  }
  .grand .amt{font-size:32px; font-weight:700; letter-spacing:-.5px}
  .grand .lbl{font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:1px}
</style>
</head>
<body>
<header>
  <div class="topbar">
    <h1>💳 Spend Tracker</h1>
    <div class="auth" id="authArea">
      <button class="btn-sm primary" id="signInBtn">Sign in</button>
    </div>
  </div>
  <div class="sync" id="syncStatus"></div>
  <div class="cards" id="cardTabs"></div>
</header>
<main>
  <section id="summaryView" style="display:none">
    <div class="grand">
      <div class="lbl">Total across all cards (this cycle)</div>
      <div class="amt" id="grandTotal">₹0</div>
    </div>
    <div class="summary" id="summaryList"></div>
  </section>

  <section id="cardView">
    <div class="cycle-nav">
      <button id="prevCycle">‹</button>
      <div class="cycle-label">
        <b id="cycleName">Statement</b>
        <span id="cycleRange"></span>
      </div>
      <button id="nextCycle">›</button>
    </div>

    <div class="total">
      <div class="lbl">Spent this cycle</div>
      <div class="amt" id="cycleTotal">₹0</div>
    </div>

    <form id="spendForm">
      <input id="amount" type="number" inputmode="decimal" step="0.01" placeholder="Amount" required>
      <input id="desc" type="text" placeholder="Description" required>
      <input id="date" type="date" required>
      <button class="add-btn" type="submit">Add spend</button>
    </form>

    <ul id="spendList"></ul>
  </section>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect,
         getRedirectResult, signOut, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, setDoc, onSnapshot }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { firebaseConfig } from "./firebase-config.js";

// ---- Card config: statement day of month ----
const CARDS = [
  {id:"amazon_icici", name:"Amazon Pay ICICI", stmtDay:12},
  {id:"sbi_cashback", name:"SBI Cashback",     stmtDay:6},
  {id:"swiggy_hdfc",  name:"Swiggy HDFC",       stmtDay:15},
  {id:"onecard",      name:"OneCard",           stmtDay:22},
  {id:"axis_myzone",  name:"Axis MyZone",       stmtDay:10},
];
const STORE_KEY = "spendTracker.v1";

// ---- State ----
let spends = load();
let activeCard = CARDS[0].id;
let cycleOffset = 0; // 0 = current cycle, -1 = previous, etc.
let view = 'summary'; // 'summary' | 'card'

// Cloud state
let db = null;          // Firestore instance (null until configured + signed in)
let currentUser = null; // signed-in user or null
let applyingRemote = false; // guard so remote snapshots don't echo back as writes

// ---- Persistence ----
function load(){
  try{ return JSON.parse(localStorage.getItem(STORE_KEY)) || []; }
  catch(e){ return []; }
}
function save(){
  localStorage.setItem(STORE_KEY, JSON.stringify(spends)); // always cache locally
  pushToCloud();                                           // and sync if signed in
}

// ---- Date / cycle helpers ----
function fmtDate(d){ return d.toISOString().slice(0,10); }
function todayStr(){ return fmtDate(new Date()); }

// Statement cycle: runs from stmtDay of one month up to (but not including)
// stmtDay of the next month. offset shifts whole cycles back/forward.
function cycleFor(stmtDay, offset){
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth(), day = now.getDate();
  // start month index of the CURRENT cycle
  let startMonth = (day >= stmtDay) ? m : m - 1;
  startMonth += offset;
  const start = new Date(y, startMonth, stmtDay);
  const end   = new Date(y, startMonth + 1, stmtDay); // exclusive
  return {start, end};
}

function cycleLabel(start){
  const mon = start.toLocaleString('en-US',{month:'short'});
  return mon + " '" + String(start.getFullYear()).slice(2);
}

function inCycle(dateStr, cyc){
  const d = new Date(dateStr + "T00:00:00");
  return d >= cyc.start && d < cyc.end;
}

// ---- Rendering ----
function money(n){
  return "₹" + n.toLocaleString('en-IN',{maximumFractionDigits:2});
}

function cycleTotalFor(card, offset){
  const cyc = cycleFor(card.stmtDay, offset);
  return spends
    .filter(s => s.card===card.id && inCycle(s.date, cyc))
    .reduce((sum,x)=> sum + Number(x.amount), 0);
}

function renderTabs(){
  const el = document.getElementById('cardTabs');
  el.innerHTML = '';
  // Summary tab first
  const sb = document.createElement('button');
  sb.className = 'tab' + (view==='summary'?' active':'');
  sb.textContent = '📊 Summary';
  sb.onclick = ()=>{ view='summary'; render(); };
  el.appendChild(sb);
  CARDS.forEach(c=>{
    const b = document.createElement('button');
    b.className = 'tab' + (view==='card' && c.id===activeCard?' active':'');
    b.textContent = c.name;
    b.onclick = ()=>{ view='card'; activeCard=c.id; cycleOffset=0; render(); };
    el.appendChild(b);
  });
}

function renderSummary(){
  let grand = 0;
  const list = document.getElementById('summaryList');
  list.innerHTML = '';
  CARDS.forEach(c=>{
    const cyc = cycleFor(c.stmtDay, 0);
    const total = cycleTotalFor(c, 0);
    grand += total;
    const endShown = new Date(cyc.end); endShown.setDate(endShown.getDate()-1);
    const opt = {day:'numeric', month:'short'};
    const range = cyc.start.toLocaleDateString('en-US',opt) + " – " + endShown.toLocaleDateString('en-US',opt);
    const row = document.createElement('div');
    row.className = 'srow';
    row.innerHTML =
      '<div class="sinfo"><div class="sname"></div><div class="scyc">'+range+'</div></div>'+
      '<div class="samt">'+money(total)+'</div><div class="schev">›</div>';
    row.querySelector('.sname').textContent = c.name;
    row.onclick = ()=>{ view='card'; activeCard=c.id; cycleOffset=0; render(); };
    list.appendChild(row);
  });
  document.getElementById('grandTotal').textContent = money(grand);
}

function render(){
  renderTabs();
  const showSummary = (view==='summary');
  document.getElementById('summaryView').style.display = showSummary ? '' : 'none';
  document.getElementById('cardView').style.display = showSummary ? 'none' : '';
  if(showSummary){ renderSummary(); return; }

  const card = CARDS.find(c=>c.id===activeCard);
  const cyc = cycleFor(card.stmtDay, cycleOffset);

  // cycle label
  document.getElementById('cycleName').textContent = cycleLabel(cyc.start) + " statement";
  const endShown = new Date(cyc.end); endShown.setDate(endShown.getDate()-1);
  const opt = {day:'numeric', month:'short'};
  document.getElementById('cycleRange').textContent =
    cyc.start.toLocaleDateString('en-US',opt) + " – " + endShown.toLocaleDateString('en-US',opt);
  document.getElementById('nextCycle').disabled = (cycleOffset >= 0);

  // filter + sort
  const items = spends
    .filter(s => s.card===activeCard && inCycle(s.date, cyc))
    .sort((a,b)=> b.date.localeCompare(a.date) || b.ts-a.ts);

  const total = items.reduce((s,x)=> s + Number(x.amount), 0);
  document.getElementById('cycleTotal').textContent = money(total);

  const list = document.getElementById('spendList');
  list.innerHTML = '';
  if(items.length===0){
    list.innerHTML = '<div class="empty">No spends in this cycle yet.</div>';
    return;
  }
  items.forEach(s=>{
    const li = document.createElement('li');
    const dt = new Date(s.date+"T00:00:00").toLocaleDateString('en-US',{day:'numeric',month:'short'});
    li.innerHTML =
      '<div class="info"><div class="d"></div><div class="dt">'+dt+'</div></div>'+
      '<div class="a">'+money(Number(s.amount))+'</div>'+
      '<button class="del" title="Delete">✕</button>';
    li.querySelector('.d').textContent = s.desc;
    li.querySelector('.del').onclick = ()=>{
      spends = spends.filter(x=>x.id!==s.id); save(); render();
    };
    list.appendChild(li);
  });
}

// ---- Events ----
document.getElementById('spendForm').addEventListener('submit', e=>{
  e.preventDefault();
  const amount = parseFloat(document.getElementById('amount').value);
  const desc = document.getElementById('desc').value.trim();
  const date = document.getElementById('date').value;
  if(!(amount>0) || !desc || !date) return;
  spends.push({
    id: Date.now()+"-"+Math.random().toString(36).slice(2,7),
    card: activeCard, amount, desc, date, ts: Date.now()
  });
  save();
  e.target.reset();
  document.getElementById('date').value = todayStr();
  // jump to the cycle the new spend belongs to (usually current)
  cycleOffset = 0;
  render();
  document.getElementById('amount').focus();
});

document.getElementById('prevCycle').onclick = ()=>{ cycleOffset--; render(); };
document.getElementById('nextCycle').onclick = ()=>{ if(cycleOffset<0){cycleOffset++; render();} };

// ---- Cloud sync (Firebase + Google sign-in) --------------------------------
const syncEl = () => document.getElementById('syncStatus');
function setSync(msg, cls){ const e=syncEl(); e.textContent=msg||''; e.className='sync'+(cls?' '+cls:''); }

function cloudConfigured(){
  return firebaseConfig && firebaseConfig.apiKey && !firebaseConfig.apiKey.startsWith('PASTE');
}

// Merge two spend arrays by id (union). Used once at sign-in so nothing is lost.
function mergeById(a, b){
  const map = new Map();
  [...a, ...b].forEach(s => { if(s && s.id) map.set(s.id, s); });
  return [...map.values()];
}

let auth = null, provider = null, unsubscribeDoc = null;

function initFirebase(){
  if(!cloudConfigured()){
    setSync('Cloud sync not configured — data stays on this device.', 'warn');
    document.getElementById('signInBtn').style.display = 'none';
    return;
  }
  const app = initializeApp(firebaseConfig);
  auth = getAuth(app);
  db = getFirestore(app);
  provider = new GoogleAuthProvider();

  // Complete any redirect-based sign-in (mobile fallback).
  getRedirectResult(auth).catch(()=>{});

  onAuthStateChanged(auth, user => {
    currentUser = user;
    renderAuth();
    if(user){ startCloudSync(user); }
    else { stopCloudSync(); }
  });
}

async function doSignIn(){
  if(!auth) return;
  try{
    await signInWithPopup(auth, provider);
  }catch(err){
    // Popups are often blocked on mobile/PWA — fall back to redirect.
    if(err && (err.code==='auth/popup-blocked' || err.code==='auth/cancelled-popup-request'
        || err.code==='auth/operation-not-supported-in-this-environment')){
      try{ await signInWithRedirect(auth, provider); return; }catch(e){}
    }
    setSync('Sign-in failed: '+(err.code||err.message||'error'), 'warn');
  }
}

async function doSignOut(){
  if(unsubscribeDoc){ unsubscribeDoc(); unsubscribeDoc=null; }
  if(auth) await signOut(auth);
}

function userDocRef(uid){ return doc(db, 'users', uid); }

async function startCloudSync(user){
  setSync('Connecting…');
  const ref = userDocRef(user.uid);

  // One-time merge: combine whatever is already on this device with the cloud,
  // so switching devices never drops entries.
  applyingRemote = true;
  const { getDoc } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
  try{
    const snap = await getDoc(ref);
    const remote = (snap.exists() && Array.isArray(snap.data().spends)) ? snap.data().spends : [];
    const merged = mergeById(spends, remote);
    spends = merged;
    localStorage.setItem(STORE_KEY, JSON.stringify(spends));
    await setDoc(ref, { spends, updatedAt: Date.now() }, { merge: true });
    render();
  }catch(e){
    setSync('Sync error: '+(e.code||e.message||'error'), 'warn');
  }
  applyingRemote = false;

  // Live updates from other devices.
  unsubscribeDoc = onSnapshot(ref, snap => {
    if(!snap.exists()) return;
    const remote = Array.isArray(snap.data().spends) ? snap.data().spends : [];
    applyingRemote = true;
    spends = remote;
    localStorage.setItem(STORE_KEY, JSON.stringify(spends));
    render();
    applyingRemote = false;
    setSync('Synced ✓', 'ok');
  }, err => setSync('Sync error: '+(err.code||'error'), 'warn'));
}

function stopCloudSync(){
  if(unsubscribeDoc){ unsubscribeDoc(); unsubscribeDoc=null; }
  setSync(cloudConfigured() ? 'Not signed in — data on this device only.' : '', cloudConfigured()?'warn':'');
}

async function pushToCloud(){
  if(!db || !currentUser || applyingRemote) return;
  try{
    await setDoc(userDocRef(currentUser.uid), { spends, updatedAt: Date.now() }, { merge: true });
    setSync('Synced ✓', 'ok');
  }catch(e){
    setSync('Offline — will sync when online.', 'warn');
  }
}

function renderAuth(){
  const area = document.getElementById('authArea');
  area.innerHTML = '';
  if(currentUser){
    const img = document.createElement('img');
    img.src = currentUser.photoURL || 'icon-192.png'; img.alt='';
    img.referrerPolicy = 'no-referrer';
    const who = document.createElement('span');
    who.className='who'; who.textContent = currentUser.displayName || currentUser.email || 'Signed in';
    const out = document.createElement('button');
    out.className='btn-sm'; out.textContent='Sign out'; out.onclick=doSignOut;
    area.append(img, who, out);
  }else{
    const inBtn = document.createElement('button');
    inBtn.className='btn-sm primary'; inBtn.textContent='Sign in'; inBtn.onclick=doSignIn;
    area.appendChild(inBtn);
  }
}

// ---- Init ----
document.getElementById('date').value = todayStr();
render();
renderAuth();
initFirebase();

// ---- PWA: register service worker (enables home-screen install + offline) ----
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
